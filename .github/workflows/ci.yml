name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - run: npm install
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
      - name: Report development dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const report = require('./npm-audit.json'); for (const [name, item] of Object.entries(report.vulnerabilities || {})) if (!item.isDirect || item.severity === 'high' || item.severity === 'critical') console.log(name + ' | ' + item.severity + ' | direct=' + item.isDirect + ' | range=' + item.range + ' | fix=' + JSON.stringify(item.fixAvailable));"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
